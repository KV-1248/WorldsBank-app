<nav class="top-nav">
  <div class="logo">
    <span class="logo-main">WORLDSBANK</span>
    <span class="logo-sub">BY GIKTEK</span>
  </div>
</nav>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Create your account</h1>
      <p>Join WorldsBank today</p>
    </div>

    <div class="login-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="firstName" placeholder="Kamau" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="lastName" placeholder="Njuguna" />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" [(ngModel)]="phoneNumber" placeholder="0XXXXXXXXX" />
      </div>

      <div class="form-group">
        <label>National ID</label>
        <input type="text" [(ngModel)]="nationalId" placeholder="Enter your ID number" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" [(ngModel)]="dateOfBirth" />
        </div>
        <div class="form-group">
          <label>Nationality</label>
          <input type="text" [(ngModel)]="nationality" placeholder="Kenyan" />
        </div>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" [(ngModel)]="address" placeholder="Nairobi, Kenya" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Min 6 characters" />
      </div>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      @if (successMessage) {
        <div class="success-message">{{ successMessage }}</div>
      }

      <button class="login-btn" (click)="register()" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account →' }}
      </button>

      <button class="register-btn" routerLink="/login">
        Already have an account? Sign In
      </button>
    </div>
  </div>
</div>
